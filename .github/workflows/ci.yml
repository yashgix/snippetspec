name: ci
on: [push, pull_request]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - run: pip install ruff
      - run: python tools/fetch_data.py
      - run: make lint
      - run: make test
      - run: make data-check
      - run: make experiment
      - run: make holdout
