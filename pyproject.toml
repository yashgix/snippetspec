[project]
name = "snippetcheck"
version = "0.1.0"
description = "Check the HTTP calls in API docs code examples against the OpenAPI spec"
requires-python = ">=3.14"
dependencies = []

[tool.ruff]
line-length = 120
target-version = "py314"
extend-exclude = ["data", "tests/acceptance"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]

[tool.ruff.lint.isort]
known-first-party = ["snippetcheck"]
